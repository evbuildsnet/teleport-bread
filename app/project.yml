name: InboxZero
options:
  bundleIdPrefix: dev.ev.inboxzero
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8X2Q3D3Y48
packages:
  InboxCore:
    path: ../packages/InboxCore
targets:
  InboxZero:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - package: InboxCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: InboxZero
        NSRemindersFullAccessUsageDescription: "InboxZero is a triage surface over your existing reminders."
        NSRemindersUsageDescription: "InboxZero is a triage surface over your existing reminders."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.inboxzero.app
        TARGETED_DEVICE_FAMILY: "1"
  InboxZeroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InboxZero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.inboxzero.uitests
        GENERATE_INFOPLIST_FILE: YES
  InboxZeroMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    dependencies:
      - package: InboxCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: InboxZero
        NSRemindersFullAccessUsageDescription: "InboxZero is a triage surface over your existing reminders."
        NSRemindersUsageDescription: "InboxZero is a triage surface over your existing reminders."
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    # No App Sandbox for now: on macOS 26 the sandboxed dev build's Reminders
    # request dies in calaccessd (XPC 4099) before any consent dialog.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.inboxzero.mac
        PRODUCT_NAME: InboxZero
        ENABLE_HARDENED_RUNTIME: YES
  InboxZeroMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests]
    dependencies:
      - target: InboxZeroMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.inboxzero.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InboxZero:
    build:
      targets:
        InboxZero: all
        InboxZeroUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [InboxZeroUITests]
  InboxZeroMac:
    build:
      targets:
        InboxZeroMac: all
        InboxZeroMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [InboxZeroMacUITests]
