name: TeleportBread
options:
  bundleIdPrefix: dev.ev.teleportbread
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CPUP238G9V
    # Direct releases override these from the tag and workflow run number.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  InboxCore:
    path: ../packages/InboxCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targetTemplates:
  MacApp:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - path: ../design/TeleportBread.icon
        buildPhase: resources
    dependencies:
      - package: InboxCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Teleport Bread
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSRemindersFullAccessUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        NSRemindersUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    # App Sandbox is required for the Mac App Store. Reminders go through
    # CalendarAgent, and the sandbox only opens that mach service for the
    # `calendars` entitlement (see /System/Library/Sandbox/Profiles/application.sb).
    # Without it the request dies with XPC 4099 before any consent dialog.
    # Both channels fetch the version policy; Direct also fetches updates.
    entitlements:
      path: Mac/TeleportBread.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.mac
        PRODUCT_NAME: TeleportBread
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: TeleportBread
targets:
  TeleportBread:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: ../design/TeleportBread.icon
        buildPhase: resources
    dependencies:
      - package: InboxCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bread
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSRemindersFullAccessUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        NSRemindersUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: TeleportBread
  TeleportBreadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TeleportBread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.uitests
        GENERATE_INFOPLIST_FILE: YES
  # Two Mac targets, one code base. `TeleportBreadMac` is the App Store build:
  # sandboxed, updates come from Apple. `TeleportBreadMacDirect` is the
  # notarized download from teleportbread.com: same sandbox plus Sparkle,
  # compiled in only under the DIRECT condition. Both share the bundle id.
  TeleportBreadMac:
    templates: [MacApp]
  TeleportBreadMacDirect:
    templates: [MacApp]
    dependencies:
      - package: Sparkle
    info:
      path: Mac/InfoDirect.plist
      properties:
        SUPublicEDKey: Ag1DQ5+weZl4IxTr9P6nJ4yF14OgRULxWHg9TkBQiEY=
        SUFeedURL: https://teleportbread.com/appcast.xml
        # On by default (no first-launch permission prompt), once a day. The
        # app also checks once right at launch (see Mac/Updater.swift).
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Sandboxed apps install updates through Sparkle's XPC launcher.
        SUEnableInstallerLauncherService: true
    entitlements:
      path: Mac/TeleportBreadDirect.entitlements
      properties:
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT
  TeleportBreadMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests]
    dependencies:
      - target: TeleportBreadMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TeleportBread:
    build:
      targets:
        TeleportBread: all
        TeleportBreadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TeleportBreadUITests]
  TeleportBreadMac:
    build:
      targets:
        TeleportBreadMac: all
        TeleportBreadMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TeleportBreadMacUITests]
  TeleportBreadMacDirect:
    build:
      targets:
        TeleportBreadMacDirect: all
    run:
      config: Debug
