name: TeleportBread
options:
  bundleIdPrefix: dev.ev.teleportbread
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CPUP238G9V
packages:
  InboxCore:
    path: ../packages/InboxCore
targets:
  TeleportBread:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: ../design/TeleportBread.icon
        buildPhase: resources
    dependencies:
      - package: InboxCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bread
        NSRemindersFullAccessUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        NSRemindersUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: TeleportBread
  TeleportBreadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TeleportBread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.uitests
        GENERATE_INFOPLIST_FILE: YES
  TeleportBreadMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - path: ../design/TeleportBread.icon
        buildPhase: resources
    dependencies:
      - package: InboxCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Teleport Bread
        NSRemindersFullAccessUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        NSRemindersUsageDescription: "Teleport Bread is a triage surface over your existing reminders."
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    # No App Sandbox for now: on macOS 26 the sandboxed dev build's Reminders
    # request dies in calaccessd (XPC 4099) before any consent dialog.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.mac
        PRODUCT_NAME: TeleportBread
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: TeleportBread
  TeleportBreadMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests]
    dependencies:
      - target: TeleportBreadMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ev.teleportbread.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TeleportBread:
    build:
      targets:
        TeleportBread: all
        TeleportBreadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TeleportBreadUITests]
  TeleportBreadMac:
    build:
      targets:
        TeleportBreadMac: all
        TeleportBreadMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TeleportBreadMacUITests]
